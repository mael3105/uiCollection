name: Maintien du projet Supabase

# Un projet Supabase gratuit inactif 7 jours est mis en pause : une lecture par semaine l'évite.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl --fail --silent --show-error \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$SUPABASE_URL/rest/v1/pages?select=id&limit=1" > /dev/null
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
